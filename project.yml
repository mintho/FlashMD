name: FlashMD
options:
  minimumXcodeGenVersion: 2.44.0
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
packages:
  FlashMDCore:
    path: Packages/FlashMDCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  FlashMD:
    type: application
    platform: macOS
    sources:
      - path: FlashMD
    dependencies:
      - package: FlashMDCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mintho.FlashMD
        PRODUCT_NAME: FlashMD
        MARKETING_VERSION: 0.5.1
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_CFBundleDisplayName: FlashMD
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 FlashMD contributors"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_EMIT_LOC_STRINGS: YES
schemes:
  FlashMD:
    build:
      targets:
        FlashMD: all
    run:
      config: Debug
    archive:
      config: Release
    profile:
      config: Release
